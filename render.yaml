# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Render builds api/Dockerfile and keeps it healthy via /health.
services:
  - type: web
    name: randevu-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # 256-bit random signing key generated by Render on first deploy.
      - key: Jwt__Key
        generateValue: true
      # Comma separated list of allowed browser origins.
      - key: Cors__Origins
        value: https://nurullahmencik.github.io
      # The free plan has an ephemeral disk: every restart starts from freshly seeded demo data.
      - key: ConnectionStrings__Default
        value: Data Source=/app/App_Data/randevu.db
